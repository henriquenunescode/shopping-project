<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen-Eva | Cadastrar Loja</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
    <main>
        <section>
            <button><i class="ti ti-arrow-left"></i> VOLTAR</button>
            <h1>Cadastre uma nova loja</h1>
            <form>
                <div>
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" placeholder="Nome">
                </div>
                <div>
                    <label for="type">Tipo</label>
                    <select name="type">
                        <option value="">Selecionar o tipo</option>
                        <option value="studio">Studio</option>
                        <option value="boutique">Boutique</option>
                        <option value="cosmeticos">Cosméticos</option>
                        <option value="tech">Tecnologia</option>
                        <option value="atelie">Ateliê</option>
                        <option value="decor">Decoração</option>
                    </select>
                </div>
                <div>
                    <label for="category">Categoria</label>
                    <select name="category">
                        <option value="">Selecionar a categoria</option>
                        <option value="moda">Moda</option>
                        <option value="casa">Casa</option>
                        <option value="beleza">Beleza</option>
                        <option value="tech">Tecnologia</option>
                    </select>
                </div>
                <button type="submit">CADASTRAR LOJA</button>
            </form>
        </section>
    </main>
</body>
</html>
