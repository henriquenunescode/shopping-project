<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojas | Boutique Élite</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/store.css">
    <link rel="stylesheet" href="../styles/header-nav.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="../scripts/auth-check.js"></script>
    <script src="../js/api.js"></script>
    <script type = "module" src="../scripts/store.js" defer></script>
</head>

<body>
    <header>
        <div class="link-button">
            <a href="#"><i class="ti ti-arrow-left"></i> VOLTAR</a>
            <button id="open-cart"><i class="ti ti-garden-cart"></i> Carrinho (<span id="update-cart">0</span>)</button>
        </div>
        <div class="title-header">
            <span>MODA</span>
            <h1>Boutique Élite</h1>
        </div>
    </header>
    <nav>
        <a href="#" id="products"><i class="ti ti-package"></i> PRODUTOS</a>
        <a href="#" id="funcionarios"><i class="ti ti-users-group"></i> FUNCIONÁRIOS</a>
    </nav>
    <main id="main-content"></main>
    <aside class="cart-products">
        <div class="title-cart">
            <h2>Carrinho</h2>
            <i class="ti ti-x" id="close-cart"></i>
        </div>
        <div class="list-cart"></div>
        <div class="total-cart">
            <div class="total">
                <h2>Total</h2>
                <span class="cart-total">R$ 0,00</span>
            </div>
            <button class="comprar">Finalizar Compra</button>
        </div>
    </aside>
</body>

</html>
